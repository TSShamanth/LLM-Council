# ── AUTO-LOAD .env FROM PROJECT ROOT ──────────────────────────────
spring.config.import=optional:file:../.env[.properties]

# ── SERVER ─────────────────────────────────────────────────────────
server.port=3002
spring.threads.virtual.enabled=true

# ── MONGODB ────────────────────────────────────────────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/council}
spring.data.mongodb.auto-index-creation=true

# ── JWT ────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET:changeme-generate-a-real-secret-with-openssl-rand-hex-64}
app.jwt.expiration-ms=86400000

# ── ADMIN ──────────────────────────────────────────────────────────
app.admin.email=${ADMIN_EMAIL:}

# ── LLM PROVIDER API KEYS ─────────────────────────────────────────
app.google.api-key=${GEMINI_API_KEY:}
app.google.model=${GEMINI_MODEL:gemini-2.0-flash}

app.groq.api-key=${GROQ_API_KEY:}
app.groq.model=${GROQ_MODEL:llama-3.3-70b-versatile}

app.openrouter.api-key=${OPENROUTER_API_KEY:}
app.openrouter.model=${OPENROUTER_MODEL:qwen/qwen3.5-plus-02-15}

app.qwen.api-key=${QWEN_API_KEY:}
app.qwen.model=${QWEN_MODEL:qwen/qwen3-coder}

app.minimax.api-key=${MINIMAX_API_KEY:}
app.minimax.model=${MINIMAX_MODEL:minimax/minimax-m2.5}

app.deepseek.api-key=${DEEPSEEK_API_KEY:}
app.deepseek.model=${DEEPSEEK_MODEL:deepseek/deepseek-v3.2}

app.moonshot.api-key=${MOONSHOT_API_KEY:}
app.moonshot.model=${MOONSHOT_MODEL:moonshotai/kimi-k2.5}

# ── RATE LIMITING ──────────────────────────────────────────────────
app.rate-limit.capacity=30
app.rate-limit.refill-tokens=30
app.rate-limit.refill-seconds=60

# ── CORS ───────────────────────────────────────────────────────────
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}

# ── LOGGING ────────────────────────────────────────────────────────
logging.level.com.council=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
